name: NAS J4125 (linux/amd64)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nas-j4125-publish
  cancel-in-progress: false

jobs:
  build-nas:
    name: Build and publish NAS image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    steps:
      - name: Check out fork source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Rust build tools
        uses: ./.github/actions/setup
        with:
          rust-version: stable
          target: x86_64-unknown-linux-gnu
          cache-shared-key: nas-j4125-v2
          cache-save-if: "true"
          install-build-packaging-tools: "false"
          install-test-tools: "false"

      - name: Download verified RustFS console
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/rustfs/console/releases/latest -o "$RUNNER_TEMP/console.json"
          python3 - "$RUNNER_TEMP/console.json" > "$RUNNER_TEMP/console-asset.txt" <<'PY'
          import json
          import re
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              release = json.load(stream)
          for asset in release.get("assets", []):
              name = asset.get("name", "")
              digest = asset.get("digest") or ""
              url = asset.get("browser_download_url") or ""
              if name.startswith("rustfs-console-") and name.endswith(".zip") and re.fullmatch(r"sha256:[a-fA-F0-9]{64}", digest) and url:
                  print(url)
                  print(digest.split(":", 1)[1])
                  break
          else:
              raise SystemExit("Console release has no SHA-256 verified ZIP")
          PY
          mapfile -t asset < "$RUNNER_TEMP/console-asset.txt"
          curl -fsSL --retry 3 "${asset[0]}" -o "$RUNNER_TEMP/console.zip"
          printf '%s  %s\n' "${asset[1]}" "$RUNNER_TEMP/console.zip" | sha256sum -c -
          mkdir -p rustfs/static
          unzip -oq "$RUNNER_TEMP/console.zip" -d rustfs/static
          test -s rustfs/static/index.html

      - name: Compile x86-64-v2 binary from fork
        shell: bash
        run: |
          set -euo pipefail
          touch rustfs/build.rs
          cargo build --release --locked --target x86_64-unknown-linux-gnu -p rustfs --bin rustfs --jobs 2
          mkdir -p dist
          install -m 0755 target/x86_64-unknown-linux-gnu/release/rustfs dist/rustfs
          file dist/rustfs
          ldd dist/rustfs
          dist/rustfs --version

      - name: Check with emulated non-AVX CPU
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user
          qemu-x86_64 -cpu Westmere -L /usr dist/rustfs --version

      - name: Build linux/amd64 container
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:nas-j4125"
          docker build --platform linux/amd64 -f deploy/nas/Dockerfile -t "$image" .
          docker run --rm --entrypoint /usr/bin/rustfs "$image" --version

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish NAS-only image
        shell: bash
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "$registry:nas-j4125" "$registry:nas-${GITHUB_SHA::12}"
          docker push "$registry:nas-${GITHUB_SHA::12}"
          docker push "$registry:nas-j4125"
          echo "Published $registry:nas-j4125" >> "$GITHUB_STEP_SUMMARY"
